<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Simple Filter without external feComposite quirks -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)"/>

  <!-- Background Decorative Glowing Orbs -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="180" fill="#6366f1"/>
    <circle cx="1050" cy="320" r="200" fill="#ec4899"/>
    <circle cx="900" cy="60" r="120" fill="#06b6d4"/>
  </g>

  <!-- Background Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Dynamic Waves -->
  <path d="M -50 320 Q 300 260 600 330 T 1250 280" fill="none" stroke="url(#primaryGlow)" stroke-width="3" opacity="0.5"/>
  <path d="M -50 100 Q 350 180 700 90 T 1250 140" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.4"/>

  <!-- Background Feature Pills -->
  <g opacity="0.9">
    <rect x="80" y="310" width="140" height="36" rx="18" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="150" y="333" fill="#818cf8" font-size="12" class="body-text" text-anchor="middle">EAM Platforms</text>

    <rect x="235" y="310" width="140" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="305" y="333" fill="#c084fc" font-size="12" class="body-text" text-anchor="middle">ITAM &amp; CMDB</text>

    <rect x="390" y="310" width="160" height="36" rx="18" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="470" y="333" fill="#22d3ee" font-size="12" class="body-text" text-anchor="middle">CMMS &amp; Work Orders</text>

    <rect x="565" y="310" width="150" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="640" y="333" fill="#f472b6" font-size="12" class="body-text" text-anchor="middle">Open-Source Tools</text>
  </g>

  <!-- FOREGROUND CONTENT -->
  <g filter="url(#shadow)">
    <!-- Top Category Badge -->
    <rect x="80" y="65" width="290" height="32" rx="16" fill="url(#primaryGlow)"/>
    <text x="225" y="86" fill="#ffffff" font-size="12" class="title-text" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="80" y="155" fill="#ffffff" font-size="44" class="title-text" letter-spacing="-0.5">Awesome Asset Lifecycle</text>
    <text x="80" y="210" fill="url(#primaryGlow)" font-size="44" class="title-text" letter-spacing="-0.5">Management</text>

    <!-- Subtitle / Description -->
    <text x="80" y="260" fill="#94a3b8" font-size="17" class="body-text">
      The definitive directory of Enterprise Asset Management (EAM), ITAM, CMDB &amp; Open-Source Tools.
    </text>
  </g>

  <!-- Right Hero Lifecycle Diagram -->
  <g filter="url(#shadow)">
    <rect x="900" y="85" width="230" height="230" rx="20" fill="url(#cardBg)" stroke="#334155" stroke-width="2"/>

    <!-- Lifecycle Loop Visual -->
    <circle cx="1015" cy="180" r="55" fill="none" stroke="url(#primaryGlow)" stroke-width="6" stroke-dasharray="70 25"/>
    
    <!-- Lifecycle Nodes -->
    <circle cx="1015" cy="125" r="14" fill="#6366f1"/>
    <text x="1015" y="129" fill="#ffffff" font-size="10" class="title-text" text-anchor="middle">1</text>
    
    <circle cx="1070" cy="180" r="14" fill="#a855f7"/>
    <text x="1070" y="184" fill="#ffffff" font-size="10" class="title-text" text-anchor="middle">2</text>

    <circle cx="1015" cy="235" r="14" fill="#ec4899"/>
    <text x="1015" y="239" fill="#ffffff" font-size="10" class="title-text" text-anchor="middle">3</text>

    <circle cx="960" cy="180" r="14" fill="#06b6d4"/>
    <text x="960" y="184" fill="#ffffff" font-size="10" class="title-text" text-anchor="middle">4</text>

    <!-- Central Text inside loop -->
    <text x="1015" y="177" fill="#ffffff" font-size="13" class="title-text" text-anchor="middle">ASSET</text>
    <text x="1015" y="192" fill="#38bdf8" font-size="10" class="body-text" text-anchor="middle">LIFECYCLE</text>

    <!-- Card Label -->
    <text x="1015" y="285" fill="#cbd5e1" font-size="12" class="title-text" text-anchor="middle">Plan → Maintain → Retire</text>
  </g>
</svg>
