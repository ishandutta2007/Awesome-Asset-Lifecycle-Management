<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes spinSync {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-card { animation: floatSlow 6s ease-in-out infinite; }
      .glowing-element { animation: pulseGlow 4s ease-in-out infinite; }
      .flowing-line { stroke-dasharray: 10 15; animation: dashFlow 20s linear infinite; }
      .rotating-gear { transform-origin: center; animation: spinSync 25s linear infinite; }
      .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .body-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)"/>

  <!-- Background Dynamic Mesh / Animated Elements in Backdrop -->
  <g class="glowing-element" opacity="0.3">
    <circle cx="150" cy="80" r="180" fill="#6366f1" filter="url(#glow)" />
    <circle cx="1050" cy="320" r="200" fill="#ec4899" filter="url(#glow)" />
    <circle cx="900" cy="60" r="120" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- Background Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Animated Dynamic Background Flow (Underneath text) -->
  <path class="flowing-line" d="M -50 320 Q 300 260 600 330 T 1250 280" fill="none" stroke="url(#primaryGlow)" stroke-width="3" opacity="0.6"/>
  <path class="flowing-line" d="M -50 100 Q 350 180 700 90 T 1250 140" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.5"/>

  <!-- Decorative Dynamic Spinning Gear Shape (Right Side Backdrop) -->
  <g class="rotating-gear" style="transform-origin: 1020px 200px;" opacity="0.15">
    <circle cx="1020" cy="200" r="90" fill="none" stroke="#6366f1" stroke-width="8" stroke-dasharray="15 10"/>
    <circle cx="1020" cy="200" r="60" fill="none" stroke="#3b82f6" stroke-width="4"/>
  </g>

  <!-- Background Decorative Pills (Positioned safely away from title) -->
  <g opacity="0.25" class="floating-card">
    <rect x="80" y="310" width="140" height="36" rx="18" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="150" y="333" fill="#818cf8" font-size="12" class="body-text" text-anchor="middle">🏢 EAM Platforms</text>

    <rect x="240" y="310" width="140" height="36" rx="18" fill="url(#cardBg)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="310" y="333" fill="#c084fc" font-size="12" class="body-text" text-anchor="middle">💻 ITAM & CMDB</text>

    <rect x="400" y="310" width="140" height="36" rx="18" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="470" y="333" fill="#22d3ee" font-size="12" class="body-text" text-anchor="middle">🔧 CMMS & Work Orders</text>

    <rect x="560" y="310" width="140" height="36" rx="18" fill="url(#cardBg)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="630" y="333" fill="#f472b6" font-size="12" class="body-text" text-anchor="middle">🔓 Open-Source Tools</text>
  </g>

  <!-- FOREGROUND CONTENT - HIGH READABILITY & CONTRAST -->
  <g filter="url(#shadow)">
    <!-- Top Category Badge -->
    <rect x="80" y="65" width="310" height="32" rx="16" fill="url(#primaryGlow)"/>
    <text x="235" y="86" fill="#ffffff" font-size="13" class="title-text" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME ECOSYSTEM 🏢🔄</text>

    <!-- Main Title -->
    <text x="80" y="155" fill="#ffffff" font-size="44" class="title-text" letter-spacing="-0.5">Awesome Asset Lifecycle</text>
    <text x="80" y="210" fill="url(#primaryGlow)" font-size="44" class="title-text" letter-spacing="-0.5">Management</text>

    <!-- Subtitle / Description -->
    <text x="80" y="260" fill="#94a3b8" font-size="18" class="body-text">
      The definitive directory of Enterprise Asset Management (EAM), ITAM, CMDB &amp; Open-Source Tools.
    </text>
  </g>

  <!-- Right Hero Accent Card / Lifecycle Diagram (Foreground Right) -->
  <g class="floating-card" filter="url(#shadow)">
    <rect x="910" y="90" width="220" height="220" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="910" y="90" width="220" height="220" rx="20" fill="url(#cardBg)"/>

    <!-- Lifecycle Loop Visual -->
    <circle cx="1020" cy="185" r="55" fill="none" stroke="url(#primaryGlow)" stroke-width="6" stroke-dasharray="70 25"/>
    
    <!-- Lifecycle Nodes -->
    <circle cx="1020" cy="130" r="14" fill="#6366f1"/>
    <text x="1020" y="134" fill="#ffffff" font-size="10" class="title-text" text-anchor="middle">1</text>
    
    <circle cx="1075" cy="185" r="14" fill="#a855f7"/>
    <text x="1075" y="189" fill="#ffffff" font-size="10" class="title-text" text-anchor="middle">2</text>

    <circle cx="1020" cy="240" r="14" fill="#ec4899"/>
    <text x="1020" y="244" fill="#ffffff" font-size="10" class="title-text" text-anchor="middle">3</text>

    <circle cx="965" cy="185" r="14" fill="#06b6d4"/>
    <text x="965" y="189" fill="#ffffff" font-size="10" class="title-text" text-anchor="middle">4</text>

    <!-- Central Text inside loop -->
    <text x="1020" y="182" fill="#ffffff" font-size="13" class="title-text" text-anchor="middle">ASSET</text>
    <text x="1020" y="197" fill="#38bdf8" font-size="10" class="body-text" text-anchor="middle">LIFECYCLE</text>

    <!-- Card Label -->
    <text x="1020" y="288" fill="#cbd5e1" font-size="12" class="title-text" text-anchor="middle">Plan ➔ Maintain ➔ Retire</text>
  </g>
</svg>
